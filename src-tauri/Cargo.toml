[package]
name = "cliswitch"
version = "0.1.0"
description = "A local desktop manager for Claude Code, Codex CLI, and OpenCode configuration"
authors = ["CLISwitch contributors"]
license = "Apache-2.0"
repository = "https://github.com/laurentwu/CLISwitch"
edition = "2024"
rust-version = "1.88"

[lib]
name = "cliswitch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cliswitch"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-window-state"
]
e2e = [
  "desktop",
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver"
]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
futures-util = "0.3.31"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
once_cell = "1.21.3"
portable-pty = "0.9.0"
regex = "1.12.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.27"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
sysinfo = { version = "0.38.3", default-features = false, features = ["system"] }
tauri = { version = "2.11.5", optional = true, features = [] }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-opener = { version = "2.5.4", optional = true }
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
tauri-plugin-window-state = { version = "2.4.1", optional = true }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_matches = "1.5.0"
tempfile = "3.24.0"
wiremock = "0.6.5"
