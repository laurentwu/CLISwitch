name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils \
            xvfb

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:production-boundary
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

      - name: Desktop E2E (Linux, isolated fixture home)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e

      - name: Desktop E2E (Windows/macOS, isolated fixture home)
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Build unsigned production bundle
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cliswitch-${{ runner.os }}-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
